overview: "Crea una biblioteca de series con el catálogo a la carta de IB3 (.strm + metadatos + subtítulos)."
description: >
  Resuelve el catálogo público de IB3 (ib3media.org) y lo replica como biblioteca de series de Jellyfin
  mediante archivos .strm con la URL del MP4 progresivo de cada vídeo, metadatos .nfo, carátula y fondo de
  la serie, miniatura del episodio y subtítulos SRT convertidos desde los WebVTT originales. Los programas
  se añaden buscándolos en el catálogo o pegando la dirección de su página en totib3.org, la página de
  configuración comprueba la carpeta de destino, crea la biblioteca que la indexa y ejecuta la
  actualización, y una tarea programada refresca la biblioteca cada pocas horas sin intervención.
category: "General"
