changelog: >
  1.1.0.0: la biblioteca sigue la taxonomía de la plataforma digital de IB3. Los programas se escriben en
  una carpeta por cada sección de totib3.org —«Actualitat», «Retransmissions», «Sèries», «Cinema»,
  «Documentals», «Programes», «Destacat» y «Arxiu»— y, dentro de ella, en la subcarpeta de la subcategoría
  que IB3 les da, así que una biblioteca curada puede apuntar a «Documentals» o a «Arxiu» sin copiar un
  solo archivo. Las secciones de audio del catálogo (los pódcast, que comparten nombre con tres secciones
  de vídeo) se descartan por su id y su tipo, y los nombres antiguos de la configuración («Informatius»,
  «Infantil»...) se siguen leyendo y se mapean a la sección que les corresponde. La página de configuración
  lista las ocho secciones con sus subcategorías y los programas que publica cada una, de modo que se
  pueden añadir en bloque en lugar de uno a uno, y una casilla nueva decide si la subcategoría se escribe
  como subcarpeta.
  1.0.0.0: primera versión. Replica el catálogo a la carta de IB3 como biblioteca de series de Jellyfin.
  La página de configuración busca en el catálogo por título o por slug, resuelve la URL de cualquier
  programa de totib3.org y de cada resultado enseña el tipo de programa, la categoría de IB3, los vídeos
  que publica, cuántos se pueden añadir y cuántos han caducado, así que un programa sin derechos no se
  añade a ciegas. Cada vínculo guarda el id del programa, su slug y el título que escribió la última
  ejecución, de modo que el programa se puede volver a resolver y su carpeta se renombra o se borra en la
  ejecución siguiente. Los programas se escriben en la carpeta de destino como .strm con la URL del MP4
  progresivo —el que publica el reproductor de IB3, sin negociación de player—, un .nfo por episodio con
  el título, la temporada y el capítulo y un tvshow.nfo con el id del programa, la carátula, el fondo, la
  descripción y sus géneros, la miniatura de cada episodio y los subtítulos de IB3 convertidos de WebVTT a
  SRT. La numeración de IB3 manda cuando es un número; un vídeo numerado con un código de producción toma
  el siguiente número libre de su temporada en orden de emisión, y los vídeos caducados o sin MP4 se
  omiten y se reintentan en la ejecución siguiente. La página elige la carpeta de destino con una
  comprobación previa (existe, se puede escribir, está dentro del servidor), crea la biblioteca «IB3» o
  añade la carpeta a la que ya se llama así, y permite organizar los programas por tipo en subcarpetas
  —«Sèries», «Documentals», «Infantil»…— o dejarlos todos en la carpeta madre, con la posibilidad de fijar
  la carpeta de cada programa a mano. Una casilla apaga los .nfo, otra los subtítulos, otra las imágenes y
  otra el borrado de los archivos de los vídeos que IB3 ha despublicado; el borrado solo toca carpetas que
  escribió el plugin y cuyo tvshow.nfo lleva el id del programa. La actualización se lanza desde la propia
  página o cada N horas con la tarea programada, y la eliminación de una serie de la lista borra su carpeta
  en la ejecución siguiente.
